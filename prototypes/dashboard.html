
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6fa;
            margin: 0;
        }

        header {
            background-color: #263b70;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .task {
            background: white;
            padding: 20px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #263b70;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Task Tracker</h1>
        <p>Stay Organized. Stay on Track.</p>
    </header>

    <main>
        <h2>My Dashboard</h2>

        <button type="button">+ Add New Task</button>

        <h3>Upcoming Assignments</h3>

        <div class="task">
            <h3>Computer Science Project</h3>
            <p>Due: October 15</p>
            <p>Status: In Progress</p>
        </div>

        <div class="task">
            <h3>Math Homework</h3>
            <p>Due: October 17</p>
            <p>Status: Not Started</p>
        </div>

        <div class="task">
            <h3>Database Assignment</h3>
            <p>Due: October 20</p>
            <p>Status: Completed</p>
        </div>

    </main>

</body>
</html>
